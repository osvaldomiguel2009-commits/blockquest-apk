name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar o jogo (www)
        run: |
          if [ -f blockquest-www.zip ]; then
            rm -rf www && mkdir www && unzip -o blockquest-www.zip -d www
          fi
          test -f www/index.html || { echo "ERRO: www/index.html não existe"; exit 1; }

      - name: Instalar Capacitor 7
        run: |
          npm init -y
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          echo '{"appId":"com.gogames.blockquest","appName":"BlockQuest","webDir":"www"}' > capacitor.config.json

      - name: Adicionar Android e sincronizar
        run: |
          npx cap add android
          npx cap sync android

      - name: Forçar modo horizontal
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Corrigir conflito de versões do Kotlin
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Usar chave de assinatura fixa (permite atualizar por cima)
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
            echo "Chave fixa em uso"
          else
            echo "Sem debug.keystore: chave aleatória (updates vão exigir desinstalar)"
          fi

      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk BlockQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlockQuest-apk
          path: BlockQuest.apk

      - name: Publicar em Releases (só quando há tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BlockQuest.apk
          
